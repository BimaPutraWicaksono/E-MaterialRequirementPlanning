<table class="table table-bordered">
  <thead class="table-light">
    <tr>
      <th>NO</th>
      <th>
        <div>
          <input type="checkbox" id="copy-budget-ref" class="form-check-input">
          <label for="copy-budget-ref" class="form-check-label">BUDGET REF. NO.</label>
        </div>
      </th>
      <th>DETAIL OF GOODS/SERVICES</th>
      <th>QTY</th>
      <th>ESTIMATED PRICE</th>
      <th>AMOUNT</th>
      <th>
        <div>
          <input type="checkbox" id="copy-deadline" class="form-check-input">
          <label for="copy-deadline" class="form-check-label">DEADLINE</label>
        </div>
      </th>
    </tr>
  </thead>
  <tbody>
    {% if parts %}
      {% for part in parts %}
      <tr class="part-row">
        <td>{{ forloop.counter }}</td>
        <td>
          <input type="text" name="budget_ref_no" class="form-control budget-ref-input" value="">
        </td>
        <td>{{ part.terminal }}-{{ part.part_name }}</td>
        <td>
          <input type="number" step="0.01" readonly class="form-control avg-round" value="{{ part.average_round|floatformat:-1 }}">
        </td>
        <td>
          <input type="number" step="0.01" name="estimated_price" class="form-control est-price" value="" placeholder="0.00">
        </td>
        <td>
          <input type="text" readonly class="form-control amount" value="0" >
        </td>
        <td>
          <input type="date" name="deadline" class="form-control deadline-input" value="{{ deadline_default }}">
        </td>
      </tr>
      {% endfor %}
    {% else %}
      <tr>
        <td colspan="7" class="text-center">No data available.</td>
      </tr>
    {% endif %}
  </tbody>
</table>
<script>
document.getElementById('copy-budget-ref').addEventListener('change', function () {
  const isChecked = this.checked;
  const inputs = document.querySelectorAll('.budget-ref-input');

  if (isChecked && inputs.length > 0) {
    const firstValue = inputs[0].value;
    inputs.forEach((input, index) => {
      if (index !== 0) {
        input.value = firstValue;
      }
    });
  }
});

document.getElementById('copy-deadline').addEventListener('change', function () {
  const isChecked = this.checked;
  const inputs = document.querySelectorAll('.deadline-input');

  if (isChecked && inputs.length > 0) {
    const firstValue = inputs[0].value;
    inputs.forEach((input, index) => {
      if (index !== 0) {
        input.value = firstValue;
      }
    });
  }
});
</script>
