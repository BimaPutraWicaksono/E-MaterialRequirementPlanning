{% extends "base.html" %}

{% block content %}
<div class="container">
  <h2 class="mb-4">Daftar Purchase Request</h2>

  <div class="mb-4">
    {% for pr in requests %}
      <button class="btn btn-outline-primary m-1 load-detail-btn" data-registered-no="{{ pr.registered_no }}">
        {{ pr.registered_no }}
      </button>
    {% empty %}
      <p>Tidak ada Purchase Request.</p>
    {% endfor %}
  </div>

  <div id="detail-container" class="mt-5"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const buttons = document.querySelectorAll(".load-detail-btn");
  const container = document.getElementById("detail-container");

  buttons.forEach(button => {
    button.addEventListener("click", function () {
      const registeredNo = this.dataset.registeredNo;

      fetch(`/e-mrp/purchase-request/detail/${registeredNo}/`)
        .then(response => response.json())
        .then(data => {
          container.innerHTML = data.html;
        });
    });
  });
});
</script>

{% endblock %}
