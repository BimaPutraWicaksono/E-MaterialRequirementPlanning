{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Confirm Delete</h2>
  <p>Are you sure you want to delete shipped: <strong>{{ shipped.name }}</strong>?</p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
    <a href="{% url 'shipped_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
