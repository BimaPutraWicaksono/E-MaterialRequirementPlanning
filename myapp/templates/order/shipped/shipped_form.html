{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">{{ form.instance.pk|yesno:"Edit Shipped,Add Shipped" }}</h2>

  <form method="POST">
    {% csrf_token %}
    <table class="clean-table">
      <tr>
        <td><strong>Name</strong></td><td>:</td>
        <td>{{ form.name }}</td>
      </tr>
    </table>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'shipped_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
