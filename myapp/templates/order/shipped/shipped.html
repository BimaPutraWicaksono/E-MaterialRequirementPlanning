{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Shipped List</h2>
    <a href="{% url 'shipped_create' %}" class="btn btn-success">Add Shipped</a>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-light text-center">
        <tr>
          <th>Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for shipped in shippeds %}
        <tr>
          <td class="text-start">{{ shipped.name }}</td>
          <td class="text-center">
            <a href="{% url 'shipped_update' shipped.id %}" class="btn btn-sm btn-success mx-2">Edit</a>
            <a href="{% url 'shipped_delete' shipped.id %}" class="btn btn-sm btn-danger">Delete</a>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="3" class="text-center">No shipped records found.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
