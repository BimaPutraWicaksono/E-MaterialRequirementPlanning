{% extends "base.html" %}
{% load user_tags %}
{% block content %}
<div class="container mt-4">
  <h4>Purchase Order</h4>
    <div class="d-flex justify-content-start align-items-start mb-4"> 
      {% for pr in requests %}
        {% if pr.approve_spv and pr.approve_sspv %}
        <div class="mb-2 p-2 mr-2 border">
            <!-- Info Table -->
            <table>
              <tr>
                <td><strong>Registered No</strong></td>
                <td>: {{ pr.registered_no }}</td>
              </tr>
            </table>
            <!-- Button -->
            <div class="text-end d-flex gap-2 mt-2" style="flex-shrink: 0;">
                <button class="btn btn-sm btn-info load-detail-btn" data-registered-no="{{ pr.registered_no }}">
                  Detail
                </button>
            </div>
        </div>
        {% endif %}
      {% empty %}
        <p>Tidak ada Purchase Order.</p>
      {% endfor %}
    </div>
    <div id="detail-container" class="mt-5"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  $(document).on("click", ".load-detail-btn", function () {
    const registeredNo = $(this).data("registered-no");

    fetch(`/e-mrp/purchase-order/detail/${registeredNo}/`)
      .then(response => response.json())
      .then(data => {
        $("#detail-container").html(data.html);

        // Setelah form dimuat, tambahkan hidden input ke form
        const form = $("#purchase-order-form");
        if (form.length > 0) {
          // Hapus input sebelumnya jika ada
          form.find("input[name=registered_no]").remove();
          // Tambahkan input tersembunyi berisi registeredNo
          form.append(`<input type="hidden" name="registered_no" value="${registeredNo}">`);
        }
      })
      .catch(error => console.error("Error fetching detail:", error));
  });

  // Form submission
  $(document).on("submit", "#purchase-order-form", function (e) {
    e.preventDefault();
    const form = $(this);
    const registeredNo = form.find("input[name=registered_no]").val();

    fetch(`/e-mrp/purchase-order/detail/${registeredNo}/`, {
      method: "POST",
      headers: {
        "X-CSRFToken": form.find("input[name=csrfmiddlewaretoken]").val(),
        "Accept": "application/json",
      },
      body: new FormData(this)
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        alert("Purchase Order berhasil disimpan.");
        location.reload();
      } else {
        alert("Terjadi kesalahan.");
      }
    })
    .catch(err => console.error("Submit error:", err));
  });


</script>
{% endblock %}
