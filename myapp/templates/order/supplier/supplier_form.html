{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">{{ title }}</h2>

  <form method="POST">
    {% csrf_token %}
    <table class="clean-table">
      <tr>
        <td><strong>Name</strong></td><td>:</td>
        <td>{{ form.name }}</td>
      </tr>
      <tr>
        <td><strong>Address</strong></td><td>:</td>
        <td>{{ form.address }}</td>
      </tr>
      <tr>
        <td><strong>Tel No</strong></td><td>:</td>
        <td>{{ form.tel_no }}</td>
      </tr>
      <tr>
        <td><strong>Fax No</strong></td><td>:</td>
        <td>{{ form.fax_no }}</td>
      </tr>
      <tr>
        <td><strong>Attn</strong></td><td>:</td>
        <td>{{ form.attn }}</td>
      </tr>
      <tr>
        <td><strong>CC</strong></td><td>:</td>
        <td>{{ form.cc }}</td>
      </tr>
    </table>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'supplier_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
