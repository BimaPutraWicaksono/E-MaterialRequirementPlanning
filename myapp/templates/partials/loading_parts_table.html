<table class="table table-bordered">
  <thead class="table-light">
    <tr>
      <th>No</th>
      <th>Budget Ref No</th>
      <th>Part Name</th>
      <th>Terminal</th>
      <th>Quantity</th>
      <th>Estimated Price</th>
      <th>Amount</th>
      <th>Deadline</th>
    </tr>
  </thead>
  <tbody>
    {% if parts %}
      {% for part in parts %}
      <tr class="part-row">
        <td>{{ forloop.counter }}</td>
        <td>
          <input type="text" name="budget_ref_no[]" class="form-control" value="">
        </td>
        <td>{{ part.part_name }}</td>
        <td>{{ part.terminal }}</td>
        <td>
          <input type="number" step="0.01" readonly class="form-control avg-round" value="{{ part.average_round }}">
        </td>
        <td>
          <input type="number" step="0.01" min="0" class="form-control est-price" name="estimated_price[]" value="0">
        </td>
        <td>
          <input type="text" readonly class="form-control amount" value="0">
        </td>
        <td>
          <input type="date" name="deadline[]" class="form-control" value="">
        </td>
      </tr>
      {% endfor %}
    {% else %}
      <tr>
        <td colspan="8" class="text-center">Tidak ada data parts.</td>
      </tr>
    {% endif %}
  </tbody>
</table>
