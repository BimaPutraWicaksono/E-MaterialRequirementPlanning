{% load static %}
<footer class="stock-control mt-5">
  <div class="profil">
    <h6>Profil</h6>
    <h3>{{ request.user.username }}</h3>
    <img src="{% static 'assets/dist/img/user.png'%}" class="profile" />
  </div>
  <div class="profil-footer">
    Sparepart Automatic | Enjin
    <br />
    <strong>Shin Buhin</strong>
    <br />
    <div class="logout mt-5">
      <a href="javascript:void(0);" class="reset-btn" id="logoutButton">
        <i class="fas fa-sign-out-alt mr-2"></i>Logout
      </a>
    </div>
  </div>
</footer>

<script>
  document.getElementById("logoutButton").addEventListener("click", function () {
    Swal.fire({
      title: "Are you sure?",
      text: "You will be logged out!",
      icon: "warning",
      showCancelButton: true,
      confirmButtonColor: "#3085d6",
      cancelButtonColor: "#d33",
      confirmButtonText: "Yes",
      cancelButtonText: "Cancel",
      customClass: {
        popup: 'custom-swal-popup',
        confirmButton: 'custom-swal-confirm-button',
        cancelButton: 'custom-swal-cancel-button'
      }
    }).then((result) => {
      if (result.isConfirmed) {
        window.location.href = "{% url 'logout' %}";
      }
    });
  });
</script>
