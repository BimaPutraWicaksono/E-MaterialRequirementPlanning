{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h4>Edit Section</h4>
  <form method="post">
    {% csrf_token %}
    <input type="text" name="name" value="{{ section.name }}" class="form-control mb-3" required>
    <select name="departement" class="form-control mb-3" required>
      {% for dept in departements %}
      <option value="{{ dept.id }}" {% if dept.id == section.departement.id %}selected{% endif %}>{{ dept.name }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-success">Simpan</button>
    <a href="{% url 'master_departement_section' %}" class="btn btn-secondary">Batal</a>
  </form>
</div>
{% endblock %}
