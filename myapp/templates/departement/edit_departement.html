{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h4>Edit Departement</h4>
  <form method="post">
    {% csrf_token %}
    <input type="text" name="name" value="{{ departement.name }}" class="form-control mb-3" required>
    <button type="submit" class="btn btn-success">Simpan</button>
    <a href="{% url 'master_departement_section' %}" class="btn btn-secondary">Batal</a>
  </form>
</div>
{% endblock %}
